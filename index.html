<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="form-action 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080609"><title>The BOOKED AF Breakdown</title>
<style>
:root{color-scheme:dark;--bg:#080609;--panel:#171117;--pink:#ff338e;--ink:#faf6f8;--muted:#c3b6c0;--line:#493442}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#48172f 0,#160d15 35%,var(--bg) 75%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;min-height:100vh;padding:25px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:950;letter-spacing:-.06em;font-size:23px}.logo b,.pink{color:var(--pink)}.top small{color:var(--muted);font-weight:700}.progress{height:4px;background:#35232e;border-radius:9px;margin:18px 0 58px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);width:0;transition:width .25s}.screen{max-width:600px;margin:auto}
.screen.intro-screen{max-width:680px}
.intro-hero{position:relative;padding:0 0 8px}
.intro-topline{color:var(--pink);font-size:clamp(62px,14vw,104px);line-height:.86;letter-spacing:-.075em;margin:0 0 30px;font-weight:950;text-shadow:0 0 34px rgba(255,51,142,.22)}
.intro-topline:after{content:"";display:block;width:72%;height:10px;margin:20px auto 0;background:var(--pink);border-radius:50%;transform:rotate(-1deg);box-shadow:0 5px 0 rgba(255,51,142,.65)}

.intro-hero:before{content:"";position:absolute;z-index:-1;width:320px;height:320px;border-radius:50%;background:rgba(255,51,142,.12);filter:blur(65px);top:-85px;right:-110px}
.intro-kicker{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,51,142,.45);border-radius:999px;padding:8px 12px;margin-bottom:24px;color:#ff75b1;font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,51,142,.06)}
.intro-title{font-size:clamp(50px,9.5vw,82px);line-height:.88;margin:0 0 28px;font-weight:950;letter-spacing:-.07em}
.intro-title .future{display:block;color:var(--pink);text-shadow:0 0 34px rgba(255,51,142,.22)}
.intro-thesis{font-size:clamp(21px,3.4vw,27px);line-height:1.22;color:var(--ink);font-weight:850;letter-spacing:-.025em;margin:0 0 24px}
.intro-copy{font-size:17px;line-height:1.65;max-width:640px}
.intro-manifesto{position:relative;overflow:hidden;border:1px solid #5b3049;border-radius:20px;background:linear-gradient(145deg,rgba(255,51,142,.12),rgba(23,17,23,.94) 42%,rgba(8,6,9,.96));padding:26px;margin:30px 0}
.intro-manifesto:after{content:"AF";position:absolute;right:-8px;bottom:-35px;font-size:130px;line-height:1;font-weight:950;letter-spacing:-.09em;color:rgba(255,51,142,.055);transform:rotate(-7deg);pointer-events:none}
.intro-quote{margin-top:30px}.intro-quote h3{font-size:clamp(24px,5vw,34px);max-width:560px}.intro-manifesto .number{margin-bottom:11px}
.intro-manifesto h3{font-size:26px;max-width:520px}
.intro-manifesto p{position:relative;z-index:1}
.intro-cta{width:100%;font-size:17px;letter-spacing:.02em;padding:18px 24px;min-height:62px;box-shadow:0 14px 38px rgba(255,51,142,.18);transition:transform .18s ease,box-shadow .18s ease}
.intro-cta:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(255,51,142,.27)}
.intro-note{text-align:center;font-size:17px;line-height:1.45;font-weight:750;color:#d9cbd4;margin:18px auto 0;max-width:600px}
.intro-note strong{color:#d9cbd4}
@media(max-width:600px){.intro-manifesto{padding:22px 19px}.intro-topline{font-size:clamp(58px,16vw,78px)}.intro-title{font-size:clamp(46px,14vw,66px)}.intro-thesis{font-size:20px}.intro-copy{font-size:16px}}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--pink);text-transform:uppercase;margin:0 0 16px}h1{font-size:clamp(52px,10vw,86px);line-height:.9;letter-spacing:-.07em;margin:0 0 26px;font-weight:950}h2{font-size:clamp(35px,7vw,55px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}h3{font-size:23px;line-height:1.1;margin:0 0 10px;letter-spacing:-.025em}p{color:var(--muted);margin:0 0 22px}.lead{font-size:19px}.choices{display:grid;gap:10px;margin:27px 0}.choice{display:block;width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);text-align:left;padding:17px 19px;font-weight:750;min-height:59px}.choice:hover,.choice:focus-visible,.choice.selected{border-color:var(--pink);outline:none;background:#2c1424}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:15px 22px;min-height:54px;font-weight:900}.primary{background:var(--pink);color:#160510}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.subtle{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 0}.input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:16px 18px;font-size:21px;margin:10px 0 4px}.input:focus{outline:2px solid var(--pink)}.hint,.fine{font-size:13px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(140deg,#21131e,#110e12);padding:24px;margin:15px 0}.card p:last-child{margin-bottom:0}.number{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.15em}.tag{display:inline-block;border:1px solid var(--pink);border-radius:50px;color:var(--pink);font-size:12px;font-weight:900;letter-spacing:.1em;padding:7px 12px;margin-bottom:18px}.error{color:#ff9abb;min-height:20px}.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.mini{color:var(--muted);font-size:14px}.price{font-size:48px;font-weight:950;letter-spacing:-.05em;color:var(--ink);margin:8px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:900;color:var(--muted);margin:3px}.locked{opacity:.72}@media(max-width:600px){.grid2{grid-template-columns:1fr}}footer{max-width:600px;margin:65px auto 0;color:#958391;font-size:12px}@media(max-width:600px){main{padding:20px 18px 45px}.progress{margin-bottom:45px}.actions>*{flex:1}.actions .subtle{flex-basis:100%}}
@media print{body{background:white;color:black}main{max-width:none}.progress,.actions,.subtle,footer,.top small,.checkline{display:none!important}.card{background:white;color:black;border:1px solid #888;break-inside:avoid}p,.fine{color:#333}.eyebrow,.number,.tag{color:#111}h2{font-size:32px}}

/* Editorial opening; the questionnaire keeps its existing layout. */
main:has(.intro-screen){max-width:1280px;padding:0 28px 60px}
main:has(.intro-screen) .top,main:has(.intro-screen) .progress{display:none}
.screen.intro-screen{max-width:none}
.intro-hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px 68px;isolation:isolate}
.intro-hero:before,.intro-topline:after{display:none}
.intro-topline{order:0;font-size:clamp(14px,1.4vw,18px);line-height:1.2;letter-spacing:.22em;font-weight:800;text-shadow:none;margin:0 0 clamp(36px,7vh,76px)}
.intro-wordmark{order:1;margin:0;color:#fff;font-size:clamp(76px,15.5vw,210px);line-height:.77;letter-spacing:-.095em;font-weight:950;white-space:nowrap}
.intro-wordmark b{color:var(--pink);font-weight:950;letter-spacing:-.13em;padding-right:.13em}
.intro-promise{order:2;margin:clamp(40px,8vh,86px) 0 clamp(36px,7vh,70px);color:#fff;font-size:clamp(20px,2.45vw,32px);line-height:1.24;letter-spacing:.16em;font-weight:850}
.intro-promise span{display:block}
.intro-cta{order:3;width:auto;min-width:min(100%,320px);min-height:60px;padding:17px 32px;border-radius:2px;font-size:14px;letter-spacing:.15em;box-shadow:none}
.intro-cta:hover{box-shadow:0 14px 38px rgba(255,51,142,.2)}
.intro-cta:focus-visible{outline:2px solid #fff;outline-offset:5px}
.intro-after{max-width:680px;margin:0 auto 70px;padding:60px 20px 0;text-align:center;border-top:1px solid var(--line)}
.intro-after .intro-kicker{border:0;background:none;padding:0;margin-bottom:24px}
.intro-after .intro-title{font-size:clamp(38px,7vw,64px)}
.intro-after .intro-copy{margin:0 auto 26px}
.intro-after .intro-quote{text-align:left}
@media(max-width:600px){main:has(.intro-screen){padding:0 16px 40px}.intro-hero{padding:42px 0 58px}.intro-topline{font-size:13px;letter-spacing:.18em;margin-bottom:clamp(48px,10vh,86px)}.intro-wordmark{font-size:clamp(49px,15vw,90px)}.intro-promise{font-size:clamp(19px,5vw,25px);letter-spacing:.11em;margin:clamp(48px,9vh,78px) 0 clamp(42px,8vh,68px)}.intro-cta{width:min(100%,310px)}.intro-after{padding:50px 4px 0}.intro-after .intro-title{font-size:clamp(38px,10vw,54px)}}

/* Premium capture + result polish */
.capture-shell{max-width:620px;margin:0 auto;padding:42px 38px 36px;border:1px solid rgba(255,255,255,.12);border-radius:2px;background:
linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),
radial-gradient(circle at 100% 0,rgba(255,51,142,.12),transparent 34%),
#0d090d;box-shadow:0 28px 90px rgba(0,0,0,.42),0 0 0 1px rgba(255,51,142,.035) inset}
.capture-wordmark{font-size:clamp(34px,7vw,54px);line-height:.9;letter-spacing:-.075em;font-weight:950;color:#fff;margin:0 0 18px}.capture-wordmark b{color:var(--pink)}
.capture-rule{height:1px;background:linear-gradient(90deg,var(--pink),rgba(255,51,142,.18),transparent);margin:0 0 34px}
.capture-title{font-size:clamp(38px,8vw,58px);max-width:560px;margin-bottom:18px}
.capture-copy{font-size:18px;line-height:1.6;max-width:560px;margin-bottom:30px}
.capture-form{display:grid;gap:8px}.capture-form label{margin-top:8px;color:#f7edf3;font-size:11px;font-weight:900;letter-spacing:.18em}
.capture-form .input{border-radius:2px;background:#0a070a;border-color:#3c2c36;padding:16px 15px;font-size:18px;transition:border-color .18s ease,box-shadow .18s ease}
.capture-form .input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,51,142,.12)}
.capture-cta{width:100%;margin-top:18px;border-radius:2px;min-height:60px;letter-spacing:.1em;font-size:13px}
.capture-skip{display:block;margin:15px auto 0;text-decoration:none;font-size:13px}
.capture-note{margin:20px 0 0;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;line-height:1.55;text-align:center;color:#9e8f99}
.result-status{margin:0 0 28px;padding:20px 22px;border-left:3px solid var(--pink);background:linear-gradient(90deg,rgba(255,51,142,.12),rgba(255,255,255,.025));box-shadow:0 16px 40px rgba(0,0,0,.2)}
.result-status span{display:block;color:var(--pink);font-size:11px;font-weight:950;letter-spacing:.18em;margin-bottom:5px}
.result-status strong{display:block;color:#fff;font-size:18px;line-height:1.35}
.result-status small{display:block;color:var(--muted);margin-top:5px;line-height:1.5}
.result-actions .secondary{border-radius:2px}
@media(max-width:600px){.capture-shell{padding:32px 22px 28px;margin:0 -2px}.capture-copy{font-size:16px}.capture-title{font-size:clamp(36px,11vw,50px)}}

</style></head><body><main><header class="top"><div class="logo">BOOKED <b>AF</b></div><small>Money. Career. Body. Life.</small></header><div class="progress" aria-hidden="true"><span id="bar"></span></div><div id="app" class="screen" aria-live="polite"></div><footer>BOOKED AF • Love your career. Keep your life.</footer></main>
