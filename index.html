<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080609"><title>BOOKED AF — The 3-Minute Read</title>
<style>
:root{color-scheme:dark;--bg:#080609;--panel:#171117;--pink:#ff338e;--ink:#faf6f8;--muted:#c3b6c0;--line:#493442}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#48172f 0,#160d15 35%,var(--bg) 75%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;min-height:100vh;padding:25px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:950;letter-spacing:-.06em;font-size:23px}.logo b,.pink{color:var(--pink)}.top small{color:var(--muted);font-weight:700}.progress{height:4px;background:#35232e;border-radius:9px;margin:18px 0 58px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);width:0;transition:width .25s}.screen{max-width:600px;margin:auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--pink);text-transform:uppercase;margin:0 0 16px}h1{font-size:clamp(52px,10vw,86px);line-height:.9;letter-spacing:-.07em;margin:0 0 26px;font-weight:950}h2{font-size:clamp(35px,7vw,55px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}h3{font-size:23px;line-height:1.1;margin:0 0 10px;letter-spacing:-.025em}p{color:var(--muted);margin:0 0 22px}.lead{font-size:19px}.choices{display:grid;gap:10px;margin:27px 0}.choice{display:block;width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);text-align:left;padding:17px 19px;font-weight:750;min-height:59px}.choice:hover,.choice:focus-visible,.choice.selected{border-color:var(--pink);outline:none;background:#2c1424}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:15px 22px;min-height:54px;font-weight:900}.primary{background:var(--pink);color:#160510}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.subtle{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 0}.input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:16px 18px;font-size:21px;margin:10px 0 4px}.input:focus{outline:2px solid var(--pink)}.hint,.fine{font-size:13px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(140deg,#21131e,#110e12);padding:24px;margin:15px 0}.card p:last-child{margin-bottom:0}.number{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.15em}.tag{display:inline-block;border:1px solid var(--pink);border-radius:50px;color:var(--pink);font-size:12px;font-weight:900;letter-spacing:.1em;padding:7px 12px;margin-bottom:18px}.error{color:#ff9abb;min-height:20px}.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.mini{color:var(--muted);font-size:14px}footer{max-width:600px;margin:65px auto 0;color:#958391;font-size:12px}@media(max-width:600px){main{padding:20px 18px 45px}.progress{margin-bottom:45px}.actions>*{flex:1}.actions .subtle{flex-basis:100%}}
@media print{body{background:white;color:black}main{max-width:none}.progress,.actions,.subtle,footer,.top small,.checkline{display:none!important}.card{background:white;color:black;border:1px solid #888;break-inside:avoid}p,.fine{color:#333}.eyebrow,.number,.tag{color:#111}h2{font-size:32px}}
</style></head><body><main><header class="top"><div class="logo">BOOKED <b>AF</b></div><small>Money. Career. Body. Life.</small></header><div class="progress" aria-hidden="true"><span id="bar"></span></div><div id="app" class="screen" aria-live="polite"></div><footer>BOOKED AF • Love your career. Keep your life.</footer></main>
<script>
const questions=[
{id:'stage',title:'Where are you with your book right now?',choices:[['building','BUILDING','I’m just getting started or rebuilding.'],['busy','GETTING BUSY','Clients are coming in, but it’s not steady yet.'],['demand','IN DEMAND','My book is pretty full.'],['booked','BOOKED AF','I’m in demand, and I want more life outside work.']]},
{id:'full',title:'How full is your book most weeks?',choices:[['under25','Less than a quarter'],['half','About halfway'],['threequarters','Mostly full'],['full','Packed, or close to it']]},
{id:'setup',title:'How do you get paid for your work?',choices:[['employee','I work for a salon and get paid hourly or commission'],['independent','I rent, have a suite, or work for myself'],['mixed','A little of both'],['unsure','I’m in school or figuring that out']]},
{id:'days',title:'How many days a week do you usually work behind the chair?',choices:[['0','Not behind the chair yet'],['1','1–2 days'],['3','3 days'],['4','4 days'],['5','5 or more days']]},
{id:'clients',title:'How many clients do you see on a usual workday?',choices:[['0','Not seeing clients yet'],['1','1–2'],['3','3–4'],['5','5–6'],['7','7 or more']]},
{id:'spend',title:'What does your average client spend on services?',choices:[['unknown','I’m not sure yet'],['75','Under $100'],['150','$100–$199'],['250','$200–$349'],['400','$350 or more']]},
{id:'retail',title:'How often do clients take home products you recommend?',choices:[['never','Almost never'],['sometimes','Sometimes'],['often','Pretty often'],['na','I don’t sell products / not sure']]},
{id:'income',title:'About how much money comes in from your work in a typical month?',note:'Your best guess is fine. If you work for a salon, think about the services you do. If you work for yourself, think about money clients pay before your work costs.',choices:[['unknown','I honestly don’t know'],['low','Under $3,000'],['mid','$3,000–$6,999'],['high','$7,000–$11,999'],['veryhigh','$12,000 or more']]},
{id:'timeoff',title:'How much time did you actually take off in the past year?',choices:[['none','Almost none'],['one','About 1 week'],['two','2–3 weeks'],['four','4 weeks or more']]},
{id:'wantoff',title:'How much time off would you like each year?',choices:[['two','2 weeks'],['four','4 weeks'],['six','6 weeks or more'],['flex','I’d rather have a more flexible week']]},
{id:'dayback',title:'If you could work one less day each week and keep your income, would you?',choices:[['yes','IN A HEARTBEAT'],['maybe','MAYBE'],['no','NOPE. I LIKE MY SCHEDULE']]},
{id:'goal',title:'What do you want your work to pay you each year?',note:'Money for you to live on, after work costs. An estimate is perfect.',choices:[['unknown','I honestly don’t know the difference yet'],['50','$50,000–$74,999'],['85','$75,000–$99,999'],['110','$100,000–$149,999'],['150','$150,000 or more']]}
];
const state={answers:{},index:-1,view:'intro',name:'',done:{}};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('bar').style.width=(state.view==='question'?Math.round((state.index)/questions.length*100):state.view==='intro'?0:100)+'%';if(state.view==='intro'){app.innerHTML=`<div class="eyebrow">The 3-minute BOOKED AF Read</div><h1>LET’S SEE<br>WHAT’S <span class="pink">REALLY</span><br>GOING ON.</h1><p class="lead">Twelve normal questions about your book, your money, and your life. We’ll show you the three things worth working on first.</p><p>BOOKED AF does the math. You answer normal questions.</p><button class="primary" id="start">LET’S DO THIS →</button>`;document.getElementById('start').onclick=()=>{state.index=0;state.view='question';render()};return}
if(state.view==='question'){const q=questions[state.index],selected=state.answers[q.id];app.innerHTML=`<div class="eyebrow">Question ${state.index+1} of 12</div><h2>${q.title}</h2>${q.note?`<p>${q.note}</p>`:''}<div class="choices">${q.choices.map(([value,label,detail])=>`<button type="button" class="choice ${selected===value?'selected':''}" data-value="${value}" aria-pressed="${selected===value}">${label}${detail?`<small>${detail}</small>`:''}</button>`).join('')}</div><div class="actions"><button class="secondary" id="back">← BACK</button><button class="primary" id="next" ${selected===undefined?'disabled':''}>${state.index===11?'SEE MY READ →':'NEXT →'}</button></div>`;app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{state.answers[q.id]=el.dataset.value;render()});document.getElementById('back').onclick=()=>{if(state.index===0)state.view='intro';else state.index--;render()};document.getElementById('next').onclick=()=>{if(state.answers[q.id]===undefined)return;if(state.index===11)state.view='teaser';else state.index++;render()};return}
if(state.view==='teaser'){const r=read();app.innerHTML=`<div class="eyebrow">Your BOOKED AF Read</div><h1>OKAY. WE<br>FOUND <span class="pink">SOME THINGS.</span></h1><p class="lead">You’re <strong>${r.stage}</strong>. Your first move: <strong>${r.top.title}</strong></p><div class="card"><div class="number">01 / 03</div><h3>${r.top.title}</h3><p>${r.top.short}</p></div><p>There are two more pieces to your Read, plus a simple first step for each.</p><button class="primary" id="show">SHOW ME THE FULL READ →</button><div><button class="subtle" id="skip">Continue without email</button></div>`;document.getElementById('show').onclick=()=>{state.view='email';render()};document.getElementById('skip').onclick=()=>{state.view='result';render()};return}
if(state.view==='email'){app.innerHTML=`<div class="eyebrow">One quick thing</div><h2>Want your Read with your name on it?</h2><p>First name and email are optional. Your full Read opens here either way. Email delivery is coming later.</p><form id="form"><label for="name">First name</label><input class="input" id="name" autocomplete="given-name" maxlength="60" placeholder="Your first name"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com"><p class="error" id="error"></p><div class="actions"><button type="submit" class="primary">SHOW MY FULL READ →</button></div></form><button class="subtle" id="skip">Continue without email</button><p class="fine">This preview does not store or send your email.</p>`;document.getElementById('form').onsubmit=e=>{e.preventDefault();const field=document.getElementById('email');if(field.value&&!field.checkValidity()){document.getElementById('error').textContent='Check that email address and try again.';field.focus();return}state.name=document.getElementById('name').value.trim().slice(0,60);state.view='result';render()};document.getElementById('skip').onclick=()=>{state.view='result';render()};return}
if(state.view==='plan'){const r=read();app.innerHTML=`<div class="eyebrow">Your first 7 days</div><span class="tag">${r.stage}</span><h2>Start small. Start this week.</h2><p class="lead">Three moves from your Read. Do them in order, at your own pace.</p>${r.items.map((item,i)=>`<div class="card"><div class="number">MOVE 0${i+1}</div><h3>${item.title}</h3><p>${item.action}</p><label class="checkline"><input type="checkbox" data-task="${item.id}" ${state.done[item.id]?'checked':''}> Done</label></div>`).join('')}<div class="card"><h3>Keep going</h3><p>Once you’ve tried these moves, revisit your Read and see what changed. BOOKED AF is building more tools for the next stage.</p></div><div class="actions"><button class="primary" id="save">SAVE OR PRINT MY PLAN</button><button class="secondary" id="backread">← BACK TO MY READ</button></div>`;app.querySelectorAll('[data-task]').forEach(el=>el.onchange=()=>{state.done[el.dataset.task]=el.checked});document.getElementById('save').onclick=()=>window.print();document.getElementById('backread').onclick=()=>{state.view='result';render()};window.scrollTo(0,0);return}
const r=read();app.innerHTML=`<div class="eyebrow">${state.name?esc(state.name)+', your':'Your'} BOOKED AF Read</div><span class="tag">${r.stage}</span><h2>Here’s what to work on first.</h2><p class="lead">${r.intro}</p>${r.items.map((item,i)=>`<div class="card"><div class="number">0${i+1} / 03</div><h3>${item.title}</h3><p>${item.body}</p><p><strong>Start here:</strong> ${item.action}</p></div>`).join('')}<div class="card"><h3>BUY BACK YOUR DAY</h3><p>${r.day}</p></div><p class="fine">This is a starting point based on your answers, not a promise of income. We haven’t worked out your actual take-home pay or work costs yet.</p><div class="actions"><button class="primary" id="plan">SHOW MY FIRST 7 DAYS →</button></div><div class="actions"><button class="secondary" id="edit">EDIT ANSWERS</button><button class="secondary" id="restart">START OVER</button></div>`;document.getElementById('plan').onclick=()=>{state.view='plan';render()};document.getElementById('edit').onclick=()=>{state.view='question';state.index=0;render()};document.getElementById('restart').onclick=()=>{state.answers={};state.done={};state.name='';state.index=-1;state.view='intro';render()}}
function read(){const a=state.answers;const stages={building:'BUILDING',busy:'GETTING BUSY',demand:'IN DEMAND',booked:'BOOKED AF'};const stage=stages[a.stage]||'BUILDING';const items=[];const add=(id,title,short,body,action,score)=>items.push({id,title,short,body,action,score});
add('book','Give your book a steadier pulse','A fuller book starts with knowing where the gaps are.','Your schedule has room to grow. You don’t need to fill every hour at once; start with the empty spots that show up again and again.','Pick one slow day. Ask three happy clients to rebook before they leave, and make it easy for them to send a friend.',(a.full==='under25'?9:a.full==='half'?7:a.full==='threequarters'?3:0)+(a.stage==='building'?2:0));
add('price','Make each workday count','Look at what a normal day earns before adding more hours.','A busy calendar can still leave you underpaid. Your average client spend and the mix of services you do are worth a closer look.','Write down your last ten service totals. Find the average and look for work you’re pricing too low.',(a.full==='full'?7:a.full==='threequarters'?5:2)+(a.spend==='75'?3:a.spend==='unknown'?2:0));
add('money','Find out what you actually keep','Money coming in and money for you are different numbers.','You deserve a clear picture of what your work pays you after the costs of doing it. That matters whether you’re on commission, independent, or both.','Look at one recent month. Write down what came in, what work cost you, and what actually landed in your pocket.',(a.income==='unknown'?9:3)+(a.goal==='unknown'?4:0)+(a.setup==='independent'||a.setup==='mixed'?2:0));
add('time','Protect your time off','Your time off needs a place on the calendar.','You told us how much time you took off and how much you want. Let’s make a plan for the difference.','Put the next two days off on your calendar. Then work out what you’d need to set aside each workweek to pay for them.',(a.timeoff==='none'?7:a.timeoff==='one'?5:a.timeoff==='two'?2:0)+(a.dayback==='yes'?4:a.dayback==='maybe'?2:0)+(a.wantoff==='six'||a.wantoff==='flex'?2:0));
add('body','Build a schedule your body can live with','The chair shouldn’t get every good hour you have.','More clients and more days are not the only way forward. If your workweek is packed, the next move is to protect your energy while keeping the money you need.','Choose one boundary for next week: a real break, a firm finish time, or one fewer squeezed-in appointment.',(a.days==='5'?7:a.days==='4'?4:1)+(a.clients==='7'?4:a.clients==='5'?2:0)+(a.dayback==='yes'?2:0));
add('retail','Make the home care conversation easier','Give clients a way to keep the result they came for.','If you recommend products, make those recommendations part of the service rather than a sales speech.','For your next five clients, recommend one product and explain exactly what it helps them do at home.',a.retail==='never'?5:a.retail==='sometimes'?3:0);
if(a.days==='0'||a.clients==='0'){items.find(x=>x.id==='book').score+=4;items.find(x=>x.id==='price').score-=3;items.find(x=>x.id==='retail').score-=5}
items.sort((x,y)=>y.score-x.score);const top=items.slice(0,3);const intro=stage==='BOOKED AF'?'Your book is in demand. Let’s make your schedule and income work better for you.':stage==='BUILDING'?'You’re building your book. Here’s where to focus first.':'You’ve got momentum. Here’s where to focus next.';const day=a.dayback==='yes'?'You’d take one less workday in a heartbeat. Start by comparing what a typical day brings in with what you actually keep, then plan how to replace that amount before changing your schedule.':a.dayback==='maybe'?'You’re open to more space in your week. Pick a lighter day and see what it would take to protect it without guessing about money.':'You like your schedule. Keep it, and use your next moves to make those days pay and feel better.';return{stage,top:top[0],items:top,intro,day}}
render();
</script></body></html>
