<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080609"><title>The BOOKED AF Breakdown</title>
<style>
:root{color-scheme:dark;--bg:#080609;--panel:#171117;--pink:#ff338e;--ink:#faf6f8;--muted:#c3b6c0;--line:#493442}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#48172f 0,#160d15 35%,var(--bg) 75%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;min-height:100vh;padding:25px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:950;letter-spacing:-.06em;font-size:23px}.logo b,.pink{color:var(--pink)}.top small{color:var(--muted);font-weight:700}.progress{height:4px;background:#35232e;border-radius:9px;margin:18px 0 58px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);width:0;transition:width .25s}.screen{max-width:600px;margin:auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--pink);text-transform:uppercase;margin:0 0 16px}h1{font-size:clamp(52px,10vw,86px);line-height:.9;letter-spacing:-.07em;margin:0 0 26px;font-weight:950}h2{font-size:clamp(35px,7vw,55px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}h3{font-size:23px;line-height:1.1;margin:0 0 10px;letter-spacing:-.025em}p{color:var(--muted);margin:0 0 22px}.lead{font-size:19px}.choices{display:grid;gap:10px;margin:27px 0}.choice{display:block;width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);text-align:left;padding:17px 19px;font-weight:750;min-height:59px}.choice:hover,.choice:focus-visible,.choice.selected{border-color:var(--pink);outline:none;background:#2c1424}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:15px 22px;min-height:54px;font-weight:900}.primary{background:var(- @media print{body{background:white;color:black}main{max-width:none}.progress,.actions,.subtle,footer,.top small,.checkline{display:none!important}.card{background:white;color:black;border:1px solid #888;break-inside:avoid}p,.fine{color:#333}.eyebrow,.number,.tag{color:#111}h2{font-size:32px}}
</style></head><body><main><header class="top"><div class="logo">BOOKED <b>AF</b></div><small>Money. Career. Body. Life.</small></header><div class="progress" aria-hidden="true"><span id="bar"></span></div><div id="app" class="screen" aria-live="polite"></div><footer>BOOKED AF • Love your career. Keep your life.</footer></main>
<script>
const questions=[
{id:'stage',title:'Where are you with your book right now?',choices:[['building','BUILDING','I’m starting, rebuilding, or still finding my people.'],['busy','GETTING BUSY','Clients are coming in, but it’s not steady yet.'],['demand','IN DEMAND','My book is pretty full.'],['booked','BOOKED AF','I’m busy. I want the money and the life to match.']]},
{id:'full',title:'How full is your book most weeks?',choices:[['under25','Less than a quarter'],['half','About halfway'],['threequarters','Mostly full'],['full','Packed, or close to it']]},
{id:'days',title:'How many days a week are you behind the chair?',choices:[['0','Not behind the chair yet'],['2','1–2 days'],['3','3 days'],['4','4 days'],['5','5 or more days']]},
{id:'clients',title:'How many clients do you usually see on a workday?',choices:[['0','Not seeing clients yet'],['2','1–2'],['4','3–4'],['6','5–6'],['7','7 or more']]},
{id:'spend',title:'What does your average client spend?',choices:[['unknown','I’m not sure'],['75','Under $100'],['150','$100–$199'],['275','$200–$349'],['400','$350 or more']]},
{id:'newclients',title:'How many new clients are finding you in a typical month?',choices:[['0','Basically none'],['2','1–3'],['6','4–8'],['10','9 or more'],['unknown','I have no idea']]},
{id:'returning',title:'After a new client sees you, how often do they come back?',choices:[['low','Not nearly enough'],['some','Some do, some don’t'],['most','Most of them come back'],['almostall','Almost everybody comes back'],['unknown','I honestly don’t know']]},
{id:'income',title:'About how much money comes in from your work in a typical month?',note:'Best guess is fine. Think about what your clients pay for services before your work costs.',choices:[['unknown','I honestly don’t know'],['low','Under $3,000'],['mid','$3,000–$6,999'],['high','$7,000–$11,999'],['veryhigh','$12,000 or more']]},
{id:'costs',title:'After you pay the costs of doing hair, how much of that money actually feels like yours?',choices:[['little','Not much. It disappears fast.'],['some','Some, but less than I think it should be.'],['good','A solid amount.'],['most','Most of it.'],['unknown','I have absolutely no idea']]},
{id:'savings',title:'If work got weird tomorrow, how much breathing room do you have?',choices:[['none','Basically none'],['month','About a month'],['few','A few months'],['solid','I’ve got a solid cushion'],['unknown','I’d rather not think about it']]},
{id:'dayback',title:'If you could work one less day every week and keep your income, would you?',choices:[['yes','IN A HEARTBEAT'],['maybe','MAYBE'],['no','NOPE. I LIKE MY SCHEDULE']]},
{id:'goal',title:'What do you want most from your career right now?',choices:[['clients','More clients in my chair'],['money','More money without cramming in more people'],['return','More clients actually coming back'],['keep','To stop wondering where all the money went'],['time','More life outside the salon'],['stable','To feel financially secure']]}
];
const deepQuestions=[
{id:'model',title:'How are you paid?',choices:[['commission','Commission or hourly'],['rent','Booth rent / suite'],['owner','I own the salon'],['mixed','A mix']]},
{id:'weekly',title:'What does a normal workweek look like?',choices:[['light','1–2 days behind the chair'],['three','3 days'],['four','4 days'],['heavy','5+ days']]},
{id:'service',title:'What kind of work makes up most of your money?',choices:[['color','Color / chemical services'],['cut','Cuts / styling'],['extensions','Extensions'],['mixed','A real mix']]},
{id:'best',title:'What does one of your better clients usually spend?',choices:[['150','Under $200'],['300','$200–$399'],['500','$400–$599'],['700','$600+']]},
{id:'monthly',title:'In a normal month, about how much do clients pay for your services?',choices:[['3000','Under $5,000'],['7500','$5,000–$9,999'],['12500','$10,000–$14,999'],['17500','$15,000+']]},
{id:'keep',title:'After work costs, roughly what percentage feels like it actually becomes yours?',choices:[['25','About 25% or less'],['40','Around 40%'],['55','Around 55%'],['70','70%+'],['unknown','No clue yet']]},
{id:'rebook',title:'How many clients leave with their next appointment booked?',choices:[['25','Less than a quarter'],['50','About half'],['75','Most of them'],['90','Almost everybody']]},
{id:'newflow',title:'How many genuinely new clients do you get in a normal month?',choices:[['1','0–2'],['5','3–7'],['10','8–12'],['15','13+']]},
{id:'holes',title:'Where are the biggest holes in your schedule?',choices:[['many','All over the place'],['some','A few every week'],['rare','Not many'],['none','Basically none']]},
{id:'pain',title:'What feels most expensive right now?',choices:[['empty','Empty chair time'],['lowticket','Clients not spending enough'],['costs','Work costs eating everything'],['hours','Too many hours behind the chair']]},
{id:'target',title:'What would make the next 30 days feel like a win?',choices:[['clients','More paying clients'],['rebook','More clients rebooking'],['money','More money from the same schedule'],['time','A clearer path to working less'],['control','Actually knowing my numbers']]},
{id:'risk',title:'How aggressive do you want this plan to be?',choices:[['steady','Steady. Give me changes I can actually stick to.'],['push','Push me. I’m ready to change things.'],['urgent','Urgent. I need movement now.']]}
];
function deepRead(){
 const a=state.deepAnswers||{}, free=read(), monthly=+a.monthly||0, keep=a.keep==='unknown'?null:+a.keep, best=+a.best||0,rebook=+a.rebook||0,newflow=+a.newflow||0;
 let path=a.target||'money'; if(a.pain==='empty')path='clients'; if(a.pain==='costs')path='control'; if(a.pain==='hours')path='time'; if(a.pain==='lowticket')path='money'; if(rebook<50&&newflow>=5)path='rebook';
 const defs={
 clients:{h:'STOP WAITING FOR A FULL BOOK.',i:'Your 30 days are about creating consistent demand without changing twelve things at once.',weeks:[['MAKE THE OFFER OBVIOUS','Choose the service you want to fill and make your profile, content, and conversations point to it.'],['WORK THE WARM PEOPLE','Ask happy clients for rebooks and referrals before spending money trying to impress strangers.'],['CREATE PROOF','Show the work, the result, and who it is for. Repeat it enough that people actually remember.'],['DOUBLE DOWN','Keep the source that created appointments. Drop the activity that only created likes.']],watch:'New inquiries → appointments booked → clients who rebook.'},
 rebook:{h:'APPOINTMENT #2 IS THE BUSINESS.',i:'You are finding people. The next 30 days are about keeping more of them.',weeks:[['FIX THE EXIT','Create a natural rebooking conversation and use it every time.'],['TRACK NEW CLIENTS','Keep one simple list: new client, next appointment offered, rebooked yes/no.'],['FOLLOW UP','Build one clean follow-up for the people who leave without booking again.'],['MEASURE IT','Compare how many new clients came in with how many secured appointment #2.']],watch:'New clients this month → number who booked appointment #2.'},
 money:{h:'MAKE THE SAME CALENDAR PAY BETTER.',i:'We are not automatically adding people or days. We are improving the economics of the work already there.',weeks:[['FIND THE LOW-VALUE WORK','Compare service price with time. Flag the work that eats hours without paying accordingly.'],['FIX ONE PRICE OR MIX PROBLEM','Adjust one thing first: price, timing, upgrade, or service combination.'],['PROTECT HIGH-VALUE WORK','Give your best services and best clients the schedule space they deserve.'],['RUN THE NEW MATH','Compare average client spend and normal-day production with your starting point.']],watch:'Average client spend + money produced per workday.'},
 time:{h:'WE ARE BUYING BACK YOUR TIME.',i:'The goal is not an emptier calendar. It is protecting income while the chair gets less of your life.',weeks:[['PRICE THE DAY YOU WANT BACK','Calculate what the day or block you want back currently produces.'],['FIND THE REPLACEMENT','Use pricing, service mix, and schedule efficiency to identify where that money can come from.'],['STOP FEEDING THE WORST HOURS','Protect the highest-value work and stop automatically filling low-value time.'],['BUILD THE BETTER WEEK','Sketch the schedule you actually want and compare it with the numbers.']],watch:'Production per workday + hours behind the chair.'},
 control:{h:'REVENUE IS NOT YOUR PAYCHECK.',i:'For 30 days, the goal is knowing what the business actually gives you—not just what clients hand you.',weeks:[['GET THE THREE NUMBERS','Money in. Work costs. Money left for you. Start with one real month.'],['FIND THE BIG LEAK','Identify the biggest recurring cost or category eating the gap.'],['SET A KEEP TARGET','Choose a realistic amount or percentage you want staying yours.'],['CHECK THE GAP','Run the same three numbers again and see whether the gap moved.']],watch:'Money in → work costs → money that stays yours.'}
 };
 const d=defs[path]||defs.money;
 let moneyTitle='KNOW YOUR STARTING NUMBER',money='Your estimated normal monthly service production is about $'+monthly.toLocaleString()+'.';
 if(keep!==null) money+=' At roughly '+keep+'% kept after work costs, that points to about $'+Math.round(monthly*keep/100).toLocaleString()+' before personal taxes and living expenses.';
 else money+=' Your first money assignment is figuring out what percentage actually stays yours.';
 const target=path==='money'&&monthly?'A 10% improvement in production at the same schedule would be about $'+Math.round(monthly*.10).toLocaleString()+'/month. This is a planning example, not an income promise.':path==='rebook'?'Your first target: move rebooking one measurable step above your current baseline.':path==='clients'?'Your first target: consistent qualified inquiries that turn into paid appointments.':path==='time'?'Your first target: know exactly what the time you want back currently produces.':'Your first target: know what you keep, not just what you sell.';
 return{headline:d.h,intro:d.i,moneyTitle,money,target,weeks:d.weeks,watchTitle:'THE NUMBERS THAT MATTER',watch:d.watch,finish:'Run the same numbers again. Keep what moved the business. Cut what only made you busy.',free};
}
const state={answers:{},index:-1,view:'intro',name:'',done:{},deepAnswers:{},deepIndex:0,deepPreview:false};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deliveryKey='booked-af-delivery-v1';
function emailCopy(r,name){
 const money=r.opportunity?("\n\nTHE MONEY OPPORTUNITY\n"+r.opportunity.title+"\n"+r.opportunity.body+(r.opportunity.gain?"\n"+r.opportunity.monthly+" more per month • "+r.opportunity.annual+" more per year":"")+"\n"+r.opportunity.math):"";
 const week=r.plan?("\n\nYOUR 7-DAY BOOKED AF PLAN\n"+r.plan.steps.map(step=>"DAY "+step.day+" — "+step.title+"\n"+step.body).join("\n\n")+"\n\nDAY 7 — "+r.plan.checkTitle+"\n"+r.plan.check+"\n\nTHE RULE THIS WEEK\n"+r.plan.rule):"";
 return "THE BOOKED AF BREAKDOWN\n\n"+(name?name+", here’s":"Here’s")+" your Breakdown.\n\nYOUR STAGE: "+r.stage+"\n\n"+r.intro+
 "\n\nWHAT I’D FIX FIRST\n"+r.fix.title+"\n"+r.fix.body+"\n\nDO THIS FIRST\n"+r.fix.first+"\n\nTHEN THIS\n"+r.fix.then+
 "\n\nDON’T DO THIS YET\n"+r.fix.dontTitle+"\n"+r.fix.dont+money+week+
 "\n\nThis is a starting point based on your answers, not a promise of income.\n\nBOOKED AF\nLove your career. Keep your life.\nbookedandfabulous.com";
}
try{if(new URLSearchParams(location.search).get('deepdive')==='preview'){state.view='deepintake';state.deepPreview=true;state.deepIndex=0;}const saved=JSON.parse(sessionStorage.getItem(deliveryKey)||'null');if(saved&&saved.answers&&typeof saved.answers==='object'){state.answers=saved.answers;state.name=String(saved.name||'').slice(0,60);state.view='result';const params=new URLSearchParams(location.search);state.emailSent=params.get('breakdown')==='sent';state.deepJoined=params.get('deepdive')==='joined';if(state.emailSent){sessionStorage.removeItem(deliveryKey);history.replaceState(null,'',location.pathname+location.hash)}}}catch(e){}
function render(){document.getElementById('bar').style.width=(state.view==='question'?Math.round((state.index)/questions.length*100):state.view==='intro'?0:100)+'%';if(state.view==='intro'){app.innerHTML=`<div class="eyebrow">The 3-minute BOOKED AF Breakdown</div><h1>LET’S SEE<br>WHAT’S <span class="pink">REALLY</span><br>GOING ON.</h1><p class="lead">Twelve normal questions about your book, your money, and your life. We’ll show you the three things worth working on first.</p><p>BOOKED AF does the math. You answer normal questions.</p><button class="primary" id="start">LET’S DO THIS →</button>`;document.getElementById('start').onclick=()=>{state.index=0;state.view='question';render()};return}
if(state.view==='question'){const q=questions[state.index],selected=state.answers[q.id];app.innerHTML=`<div class="eyebrow">Question ${state.index+1} of 12</div><h2>${q.title}</h2>${q.note?`<p>${q.note}</p>`:''}<div class="choices">${q.choices.map(([value,label,detail])=>`<button type="button" class="choice ${selected===value?'selected':''}" data-value="${value}" aria-pressed="${selected===value}">${label}${detail?`<small>${detail}</small>`:''}</button>`).join('')}</div><div class="actions"><button class="secondary" id="back">← BACK</button><button class="primary" id="next" ${selected===undefined?'disabled':''}>${state.index===11?'SEE MY BREAKDOWN →':'NEXT →'}</button></div>`;app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{state.answers[q.id]=el.dataset.value;render()});document.getElementById('back').onclick=()=>{if(state.index===0)state.view='intro';else state.index--;render()};document.getElementById('next').onclick=()=>{if(state.answers[q.id]===undefined)return;if(state.index===11)state.view='teaser';else state.index++;render()};return}
if(state.view==='teaser'){const r=read();app.innerHTML=`<div class="eyebrow">Your BOOKED AF Breakdown</div><h1>OKAY. WE<br>FOUND <span class="pink">SOME THINGS.</span></h1><p class="lead">You’re <strong>${r.stage}</strong>. Your first move: <strong>${r.top.title}</strong></p><div class="card"><div class="number">01 / 03</div><h3>${r.top.title}</h3><p>${r.top.short}</p></div><p>${r.items.length>1?`There ${r.items.length===2?'is one more piece':'are two more pieces'} to your Breakdown, plus a simple first step for each.`:'This is the main thing worth fixing first. We’re not inventing extra problems just to fill boxes.'}</p><button class="primary" id="show">SHOW ME THE FULL BREAKDOWN →</button><div><button class="subtle" id="skip">Continue without email</button></div>`;document.getElementById('show').onclick=()=>{state.view='email';render()};document.getElementById('skip').onclick=()=>{state.view='result';render()};return}
if(state.view==='email'){app.innerHTML=`<div class="eyebrow">One quick thing</div><h2>Keep this. You’re going to want it.</h2><p>We’ll send your diagnosis, Money Opportunity, what I’d fix first, and your full 7-Day BOOKED AF Plan straight to your inbox.</p><form id="form" method="POST" action="https://formsubmit.co/hello@bookedandfabulous.com"><label for="name">First name</label><input class="input" id="name" name="name" autocomplete="given-name" maxlength="60" placeholder="Your first name"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><input type="hidden" name="_subject" value="Your BOOKED AF Breakdown + 7-Day Plan"><input type="hidden" name="_next" value="https://bookedandfabulous.com/?breakdown=sent"><input type="hidden" name="stage"><input type="hidden" name="breakdown"><input type="hidden" name="_autoresponse"><input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-10000px" aria-hidden="true"><p class="error" id="error"></p><div class="actions"><button type="submit" class="primary">SEND ME MY BREAKDOWN →</button></div></form><button class="subtle" id="skip">Continue without email</button><p class="fine">No endless newsletter nonsense. This sends you the Breakdown you just built. You may see a quick spam check the first time.</p>`;document.getElementById('form').onsubmit=e=>{const form=e.currentTarget,field=document.getElementById('email');if(!field.checkValidity()){e.preventDefault();document.getElementById('error').textContent='Check that email address and try again.';field.focus();return}state.name=document.getElementById('name').value.trim().slice(0,60);const r=read(),copy=emailCopy(r,state.name);form.elements.stage.value=r.stage;form.elements.breakdown.value=copy;form.elements._autoresponse.value=copy;try{sessionStorage.setItem(deliveryKey,JSON.stringify({answers:state.answers,name:state.name}))}catch(err){}};document.getElementById('skip').onclick=()=>{state.view='result';render()};return}
if(state.view==='paid'){const r=read();app.innerHTML=`<div class="eyebrow">BOOKED AF Deep Dive</div><span class="tag">FOUNDING OFFER • FIRST 25</span><h2>Your free Breakdown found the problem. Now we build the fix.</h2><p class="lead">This is the paid layer: your numbers, your schedule, your clients, your goal—and a 30-day plan built around them.</p><div class="card"><div class="price">$49</div><p><strong>Founding price.</strong> One payment. No subscription. The first 25 buyers keep this price for this version.</p></div><div class="grid2"><div class="card"><h3>THE MONEY</h3><p>Production, work costs, what stays yours, pricing opportunity, and the number behind the schedule you actually want.</p></div><div class="card"><h3>THE BOOK</h3><p>Client flow, rebooking, service mix, and whether you need more people—or need to stop cramming them in.</p></div><div class="card"><h3>THE 30 DAYS</h3><p>Four weeks of specific moves in the right order. No 47-item homework list.</p></div><div class="card"><h3>THE NEXT NUMBER</h3><p>The one or two numbers worth watching next so you know whether the plan is actually working.</p></div></div><div class="card"><div class="number">EXAMPLE</div><h3>Busy + underpriced?</h3><p>We won’t tell you to “market harder.” We’ll calculate what your current book produces, find the work paying you the least for your time, and build the month around fixing that first.</p></div><div class="card"><h3>WHEN CHECKOUT GOES LIVE</h3><p>After payment, you’ll land directly in the private Deep Dive intake. Finish it once and BOOKED AF builds your personalized 30-day plan.</p></div><form id="interest" method="POST" action="https://formsubmit.co/hello@bookedandfabulous.com"><label for="paidname">First name</label><input class="input" id="paidname" name="name" autocomplete="given-name" maxlength="60" value="${esc(state.name||'')}" placeholder="Your first name"><label for="paidemail">Email</label><input class="input" id="paidemail" name="email" type="email" autocomp
