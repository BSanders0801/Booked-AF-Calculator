<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080609"><title>The BOOKED AF Breakdown</title>
<style>
:root{color-scheme:dark;--bg:#080609;--panel:#171117;--pink:#ff338e;--ink:#faf6f8;--muted:#c3b6c0;--line:#493442}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#48172f 0,#160d15 35%,var(--bg) 75%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;min-height:100vh;padding:25px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:950;letter-spacing:-.06em;font-size:23px}.logo b,.pink{color:var(--pink)}.top small{color:var(--muted);font-weight:700}.progress{height:4px;background:#35232e;border-radius:9px;margin:18px 0 58px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);width:0;transition:width .25s}.screen{max-width:600px;margin:auto}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--pink);text-transform:uppercase;margin:0 0 16px}h1{font-size:clamp(52px,10vw,86px);line-height:.9;letter-spacing:-.07em;margin:0 0 26px;font-weight:950}h2{font-size:clamp(35px,7vw,55px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}h3{font-size:23px;line-height:1.1;margin:0 0 10px;letter-spacing:-.025em}p{color:var(--muted);margin:0 0 22px}.lead{font-size:19px}.choices{display:grid;gap:10px;margin:27px 0}.choice{display:block;width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);text-align:left;padding:17px 19px;font-weight:750;min-height:59px}.choice:hover,.choice:focus-visible,.choice.selected{border-color:var(--pink);outline:none;background:#2c1424}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:15px 22px;min-height:54px;font-weight:900}.primary{background:var(--pink);color:#160510}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.subtle{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 0}.input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:16px 18px;font-size:21px;margin:10px 0 4px}.input:focus{outline:2px solid var(--pink)}.hint,.fine{font-size:13px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(140deg,#21131e,#110e12);padding:24px;margin:15px 0}.card p:last-child{margin-bottom:0}.number{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.15em}.tag{display:inline-block;border:1px solid var(--pink);border-radius:50px;color:var(--pink);font-size:12px;font-weight:900;letter-spacing:.1em;padding:7px 12px;margin-bottom:18px}.error{color:#ff9abb;min-height:20px}.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.mini{color:var(--muted);font-size:14px}footer{max-width:600px;margin:65px auto 0;color:#958391;font-size:12px}@media(max-width:600px){main{padding:20px 18px 45px}.progress{margin-bottom:45px}.actions>*{flex:1}.actions .subtle{flex-basis:100%}}
@media print{body{background:white;color:black}main{max-width:none}.progress,.actions,.subtle,footer,.top small,.checkline{display:none!important}.card{background:white;color:black;border:1px solid #888;break-inside:avoid}p,.fine{color:#333}.eyebrow,.number,.tag{color:#111}h2{font-size:32px}}
</style></head><body><main><header class="top"><div class="logo">BOOKED <b>AF</b></div><small>Money. Career. Body. Life.</small></header><div class="progress" aria-hidden="true"><span id="bar"></span></div><div id="app" class="screen" aria-live="polite"></div><footer>BOOKED AF • Love your career. Keep your life.</footer></main>
<script>
const questions=[
{id:'stage',title:'Where are you with your book right now?',choices:[['building','BUILDING','I’m starting, rebuilding, or still finding my people.'],['busy','GETTING BUSY','Clients are coming in, but it’s not steady yet.'],['demand','IN DEMAND','My book is pretty full.'],['booked','BOOKED AF','I’m busy. I want the money and the life to match.']]},
{id:'full',title:'How full is your book most weeks?',choices:[['under25','Less than a quarter'],['half','About halfway'],['threequarters','Mostly full'],['full','Packed, or close to it']]},
{id:'days',title:'How many days a week are you behind the chair?',choices:[['0','Not behind the chair yet'],['2','1–2 days'],['3','3 days'],['4','4 days'],['5','5 or more days']]},
{id:'clients',title:'How many clients do you usually see on a workday?',choices:[['0','Not seeing clients yet'],['2','1–2'],['4','3–4'],['6','5–6'],['7','7 or more']]},
{id:'spend',title:'What does your average client spend?',choices:[['unknown','I’m not sure'],['75','Under $100'],['150','$100–$199'],['275','$200–$349'],['400','$350 or more']]},
{id:'newclients',title:'How many new clients are finding you in a typical month?',choices:[['0','Basically none'],['2','1–3'],['6','4–8'],['10','9 or more'],['unknown','I have no idea']]},
{id:'returning',title:'After a new client sees you, how often do they come back?',choices:[['low','Not nearly enough'],['some','Some do, some don’t'],['most','Most of them come back'],['almostall','Almost everybody comes back'],['unknown','I honestly don’t know']]},
{id:'income',title:'About how much money comes in from your work in a typical month?',note:'Best guess is fine. Think about what your clients pay for services before your work costs.',choices:[['unknown','I honestly don’t know'],['low','Under $3,000'],['mid','$3,000–$6,999'],['high','$7,000–$11,999'],['veryhigh','$12,000 or more']]},
{id:'costs',title:'After you pay the costs of doing hair, how much of that money actually feels like yours?',choices:[['little','Not much. It disappears fast.'],['some','Some, but less than I think it should be.'],['good','A solid amount.'],['most','Most of it.'],['unknown','I have absolutely no idea']]},
{id:'savings',title:'If work got weird tomorrow, how much breathing room do you have?',choices:[['none','Basically none'],['month','About a month'],['few','A few months'],['solid','I’ve got a solid cushion'],['unknown','I’d rather not think about it']]},
{id:'dayback',title:'If you could work one less day every week and keep your income, would you?',choices:[['yes','IN A HEARTBEAT'],['maybe','MAYBE'],['no','NOPE. I LIKE MY SCHEDULE']]},
{id:'goal',title:'What do you want most from your career right now?',choices:[['clients','More clients in my chair'],['money','More money without cramming in more people'],['return','More clients actually coming back'],['keep','To stop wondering where all the money went'],['time','More life outside the salon'],['stable','To feel financially secure']]}
];
const state={answers:{},index:-1,view:'intro',name:'',done:{}};const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const deliveryKey='booked-af-delivery-v1';
function emailCopy(r,name){return `THE BOOKED AF BREAKDOWN\n\n${name?name+', here is':'Here is'} your Breakdown.\n\nYOUR STAGE: ${r.stage}\n\n${r.intro}\n\n${r.items.map((item,i)=>`${i+1}. ${item.title}\n${item.body}\nStart here: ${item.action}`).join('\n\n')}\n\nBUY BACK YOUR DAY\n${r.day}\n\nYOUR FIRST 7 DAYS\n${r.items.map((item,i)=>`Move ${i+1}: ${item.action}`).join('\n')}\n\nThis is a starting point based on your answers, not a promise of income. We haven't worked out your actual take-home pay or work costs yet.\n\nBOOKED AF — Love your career. Keep your life.`}
try{const saved=JSON.parse(sessionStorage.getItem(deliveryKey)||'null');if(saved&&saved.answers&&typeof saved.answers==='object'){state.answers=saved.answers;state.name=String(saved.name||'').slice(0,60);state.view='result';state.emailSent=new URLSearchParams(location.search).get('breakdown')==='sent';if(state.emailSent){sessionStorage.removeItem(deliveryKey);history.replaceState(null,'',location.pathname+location.hash)}}}catch(e){}
function render(){document.getElementById('bar').style.width=(state.view==='question'?Math.round((state.index)/questions.length*100):state.view==='intro'?0:100)+'%';if(state.view==='intro'){app.innerHTML=`<div class="eyebrow">The 3-minute BOOKED AF Breakdown</div><h1>LET’S SEE<br>WHAT’S <span class="pink">REALLY</span><br>GOING ON.</h1><p class="lead">Twelve normal questions about your book, your money, and your life. We’ll show you the three things worth working on first.</p><p>BOOKED AF does the math. You answer normal questions.</p><button class="primary" id="start">LET’S DO THIS →</button>`;document.getElementById('start').onclick=()=>{state.index=0;state.view='question';render()};return}
if(state.view==='question'){const q=questions[state.index],selected=state.answers[q.id];app.innerHTML=`<div class="eyebrow">Question ${state.index+1} of 12</div><h2>${q.title}</h2>${q.note?`<p>${q.note}</p>`:''}<div class="choices">${q.choices.map(([value,label,detail])=>`<button type="button" class="choice ${selected===value?'selected':''}" data-value="${value}" aria-pressed="${selected===value}">${label}${detail?`<small>${detail}</small>`:''}</button>`).join('')}</div><div class="actions"><button class="secondary" id="back">← BACK</button><button class="primary" id="next" ${selected===undefined?'disabled':''}>${state.index===11?'SEE MY BREAKDOWN →':'NEXT →'}</button></div>`;app.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{state.answers[q.id]=el.dataset.value;render()});document.getElementById('back').onclick=()=>{if(state.index===0)state.view='intro';else state.index--;render()};document.getElementById('next').onclick=()=>{if(state.answers[q.id]===undefined)return;if(state.index===11)state.view='teaser';else state.index++;render()};return}
if(state.view==='teaser'){const r=read();app.innerHTML=`<div class="eyebrow">Your BOOKED AF Breakdown</div><h1>OKAY. WE<br>FOUND <span class="pink">SOME THINGS.</span></h1><p class="lead">You’re <strong>${r.stage}</strong>. Your first move: <strong>${r.top.title}</strong></p><div class="card"><div class="number">01 / 03</div><h3>${r.top.title}</h3><p>${r.top.short}</p></div><p>There are two more pieces to your Breakdown, plus a simple first step for each.</p><button class="primary" id="show">SHOW ME THE FULL BREAKDOWN →</button><div><button class="subtle" id="skip">Continue without email</button></div>`;document.getElementById('show').onclick=()=>{state.view='email';render()};document.getElementById('skip').onclick=()=>{state.view='result';render()};return}
if(state.view==='email'){app.innerHTML=`<div class="eyebrow">One quick thing</div><h2>Want your Breakdown in your inbox?</h2><p>Enter your email and we’ll send your personalized Breakdown and first 7 days. You can see it here without giving us an email, too.</p><form id="form" method="POST" action="https://formsubmit.co/hello@bookedandfabulous.com"><label for="name">First name</label><input class="input" id="name" name="name" autocomplete="given-name" maxlength="60" placeholder="Your first name"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><input type="hidden" name="_subject" value="New BOOKED AF Breakdown signup"><input type="hidden" name="_next" value="https://bookedandfabulous.com/?breakdown=sent"><input type="hidden" name="stage"><input type="hidden" name="breakdown"><input type="hidden" name="_autoresponse"><input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-10000px" aria-hidden="true"><p class="error" id="error"></p><div class="actions"><button type="submit" class="primary">EMAIL MY BREAKDOWN →</button></div></form><button class="subtle" id="skip">Continue without email</button><p class="fine">Sending uses FormSubmit, which delivers your result to you and your signup to BOOKED AF. You may see a quick spam check.</p>`;document.getElementById('form').onsubmit=e=>{const form=e.currentTarget,field=document.getElementById('email');if(!field.checkValidity()){e.preventDefault();document.getElementById('error').textContent='Check that email address and try again.';field.focus();return}state.name=document.getElementById('name').value.trim().slice(0,60);const r=read(),copy=emailCopy(r,state.name);form.elements.stage.value=r.stage;form.elements.breakdown.value=copy;form.elements._autoresponse.value=copy;try{sessionStorage.setItem(deliveryKey,JSON.stringify({answers:state.answers,name:state.name}))}catch(err){}};document.getElementById('skip').onclick=()=>{state.view='result';render()};return}
if(state.view==='plan'){const r=read();app.innerHTML=`<div class="eyebrow">Your first 7 days</div><span class="tag">${r.stage}</span><h2>Start small. Start this week.</h2><p class="lead">Three moves from your Breakdown. Do them in order, at your own pace.</p>${r.items.map((item,i)=>`<div class="card"><div class="number">MOVE 0${i+1}</div><h3>${item.title}</h3><p>${item.action}</p><label class="checkline"><input type="checkbox" data-task="${item.id}" ${state.done[item.id]?'checked':''}> Done</label></div>`).join('')}<div class="card"><h3>Keep going</h3><p>Once you’ve tried these moves, revisit your Breakdown and see what changed. BOOKED AF is building more tools for the next stage.</p></div><div class="actions"><button class="primary" id="save">SAVE OR PRINT MY PLAN</button><button class="secondary" id="backread">← BACK TO MY BREAKDOWN</button></div>`;app.querySelectorAll('[data-task]').forEach(el=>el.onchange=()=>{state.done[el.dataset.task]=el.checked});document.getElementById('save').onclick=()=>window.print();document.getElementById('backread').onclick=()=>{state.view='result';render()};window.scrollTo(0,0);return}
const r=read();app.innerHTML=`${state.emailSent?'<div class="card" role="status"><strong>Your Breakdown is on its way.</strong> Check your inbox (and spam folder) for the email.</div>':''}<div class="eyebrow">${state.name?esc(state.name)+', your':'Your'} BOOKED AF Breakdown</div><span class="tag">${r.stage}</span><h2>Here’s what to work on first.</h2><p class="lead">${r.intro}</p>${r.items.map((item,i)=>`<div class="card"><div class="number">0${i+1} / 03</div><h3>${item.title}</h3><p>${item.body}</p><p><strong>Start here:</strong> ${item.action}</p></div>`).join('')}<div class="card"><h3>BUY BACK YOUR DAY</h3><p>${r.day}</p></div><p class="fine">This is a starting point based on your answers, not a promise of income. We haven’t worked out your actual take-home pay or work costs yet.</p><div class="actions"><button class="primary" id="plan">SHOW MY FIRST 7 DAYS →</button></div><div class="actions"><button class="secondary" id="edit">EDIT ANSWERS</button><button class="secondary" id="restart">START OVER</button></div>`;document.getElementById('plan').onclick=()=>{state.view='plan';render()};document.getElementById('edit').onclick=()=>{state.view='question';state.index=0;render()};document.getElementById('restart').onclick=()=>{state.answers={};state.done={};state.name='';state.emailSent=false;sessionStorage.removeItem(deliveryKey);state.index=-1;state.view='intro';render()}}
function read(){
 const a=state.answers, items=[]; const stage=({building:'BUILDING',busy:'GETTING BUSY',demand:'IN DEMAND',booked:'BOOKED AF'})[a.stage]||'BUILDING';
 const starting=a.days==='0'||a.clients==='0', packed=a.full==='full'||a.full==='threequarters';
 const days=+a.days||0,clients=+a.clients||0,spend=+a.spend||0,estMonth=days&&clients&&spend?days*4.33*clients*spend:0;
 const fill={under25:20,half:50,threequarters:78,full:95}[a.full]||0;
 let s={fill:0,cheap:0,return:0,time:0,money:0,life:0};
 s.fill+=(100-fill)/12;if(a.newclients==='0')s.fill+=4;if(a.newclients==='2')s.fill+=2;if(a.goal==='clients')s.fill+=4;if(starting)s.fill+=6;
 if(packed)s.cheap+=4;if(a.spend==='75')s.cheap+=5;if(a.spend==='150')s.cheap+=3;if(a.goal==='money')s.cheap+=4;if(estMonth&&estMonth<7000&&packed)s.cheap+=3;
 if(a.newclients==='6'||a.newclients==='10')s.return+=3;if(a.returning==='low')s.return+=7;if(a.returning==='some')s.return+=4;if(a.goal==='return')s.return+=5;
 if(days>=5)s.time+=6;else if(days===4)s.time+=3;if(clients>=7)s.time+=3;if(a.dayback==='yes')s.time+=5;if(a.dayback==='maybe')s.time+=2;if(a.goal==='time')s.time+=5;
 if(a.costs==='little')s.money+=7;if(a.costs==='some')s.money+=4;if(a.costs==='unknown')s.money+=3;if(a.savings==='none')s.money+=5;if(a.savings==='month')s.money+=3;if(a.goal==='keep'||a.goal==='stable')s.money+=5;
 if(packed&&(a.returning==='most'||a.returning==='almostall')&&(a.costs==='good'||a.costs==='most'))s.life+=5;if(a.savings==='few'||a.savings==='solid')s.life+=3;if(a.dayback==='yes')s.life+=3;if(a.goal==='time')s.life+=4;
 const defs={
 fill:['FILL THE BOOK','You don’t need to squeeze more out of every client yet. You need more of the right people in the chair.','Your biggest opportunity is getting a steadier flow of paying clients.','Pick the service you want to be known for. Show that work three times this week and personally invite five people to book or refer someone.'],
 cheap:['YOU’RE TOO CHEAP','Your book has momentum. The money should start matching how hard you’re working.','More appointments are not automatically the answer. The value of the appointments already on your calendar deserves a look.','Pull your last 10 service totals. Find the average, then flag the services that take the most time for the least money.'],
 return:['THE REVOLVING DOOR','People are finding you. Too many just aren’t making appointment #2.','Marketing harder won’t fix a leaky bucket. Make the return visit easier before chasing more strangers.','For your next five new clients, recommend the next appointment before they leave and make rebooking ridiculously easy.'],
 time:['YOUR BOOK OWNS YOU','You built a career. It does not need to own every good hour of your week.','The next move is not automatically more clients. It’s making your existing work support more life outside the salon.','Choose the day or block of time you most want back. Work out what that block currently brings in before you add another appointment anywhere.'],
 money:['WHERE DID THE MONEY GO?','Money is coming through the business, but not enough of it is turning into security for you.','Being busy and building wealth are not the same thing. First we need to see what actually stays yours.','Take one recent month: money in, work costs out, money that actually landed in your pocket. Three numbers. No fancy spreadsheet.'],
 life:['BUY BACK YOUR LIFE','A lot of the machine is working. Now use it to create something better than a packed calendar: time.','Your next level is protecting income while reducing how much of your life the chair gets.','Pick one workday you’d eventually like back. Calculate what that day produces now so we know the number we need to replace—not guess at.']
 };
 let ranked=Object.entries(s).sort((x,y)=>y[1]-x[1]);if(starting)ranked=[['fill',99],...ranked.filter(x=>x[0]!=='fill')];
 const chosen=[];for(const [id,score] of ranked){if(chosen.length===3)break;if(score<=0)continue;const d=defs[id];chosen.push({id,title:d[0],short:d[1],body:d[2],action:d[3],score});}
 while(chosen.length<3){const id=['fill','money','time'].find(x=>!chosen.some(i=>i.id===x));const d=defs[id];chosen.push({id,title:d[0],short:d[1],body:d[2],action:d[3],score:0});}
 const top=chosen[0],intro=top.id==='fill'?'First priority: build demand before trying to optimize a business that is still growing.':top.short;
 const day=a.dayback==='yes'?'You said you’d take a day back in a heartbeat. Good. We’re going to treat that as a business goal, not a fantasy.':a.dayback==='maybe'?'You’re open to more room in your week. We’ll look for it without gambling with your income.':'You like your schedule. Great. The goal is to make those days work better for you.';
 return{stage,top,items:chosen,intro,day};
}
render();
</script></body></html>
