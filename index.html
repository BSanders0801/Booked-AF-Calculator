<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080609"><title>The BOOKED AF Breakdown</title>
<style>
:root{color-scheme:dark;--bg:#080609;--panel:#171117;--pink:#ff338e;--ink:#faf6f8;--muted:#c3b6c0;--line:#493442}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#48172f 0,#160d15 35%,var(--bg) 75%);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}main{max-width:720px;margin:auto;min-height:100vh;padding:25px 22px 60px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.logo{font-weight:950;letter-spacing:-.06em;font-size:23px}.logo b,.pink{color:var(--pink)}.top small{color:var(--muted);font-weight:700}.progress{height:4px;background:#35232e;border-radius:9px;margin:18px 0 58px;overflow:hidden}.progress span{display:block;height:100%;background:var(--pink);width:0;transition:width .25s}.screen{max-width:600px;margin:auto}
.screen.intro-screen{max-width:680px}
.intro-hero{position:relative;padding:10px 0 8px}
.intro-hero:before{content:"";position:absolute;z-index:-1;width:320px;height:320px;border-radius:50%;background:rgba(255,51,142,.12);filter:blur(65px);top:-85px;right:-110px}
.intro-kicker{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,51,142,.45);border-radius:999px;padding:8px 12px;margin-bottom:24px;color:#ff75b1;font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,51,142,.06)}
.intro-title{font-size:clamp(50px,9.5vw,82px);line-height:.88;margin-bottom:28px}
.intro-title .future{display:block;color:var(--pink);text-shadow:0 0 34px rgba(255,51,142,.22)}
.intro-thesis{font-size:clamp(21px,3.4vw,27px);line-height:1.22;color:var(--ink);font-weight:850;letter-spacing:-.025em;margin:0 0 24px}
.intro-copy{font-size:17px;line-height:1.65;max-width:640px}
.intro-manifesto{position:relative;overflow:hidden;border:1px solid #5b3049;border-radius:20px;background:linear-gradient(145deg,rgba(255,51,142,.12),rgba(23,17,23,.94) 42%,rgba(8,6,9,.96));padding:26px;margin:30px 0}
.intro-manifesto:after{content:"AF";position:absolute;right:-8px;bottom:-35px;font-size:130px;line-height:1;font-weight:950;letter-spacing:-.09em;color:rgba(255,51,142,.055);transform:rotate(-7deg);pointer-events:none}
.intro-manifesto .number{margin-bottom:11px}
.intro-manifesto h3{font-size:26px;max-width:520px}
.intro-manifesto p{position:relative;z-index:1}
.intro-cta{width:100%;font-size:17px;letter-spacing:.02em;padding:18px 24px;min-height:62px;box-shadow:0 14px 38px rgba(255,51,142,.18);transition:transform .18s ease,box-shadow .18s ease}
.intro-cta:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(255,51,142,.27)}
.intro-note{text-align:center;font-size:12px;color:#a996a4;margin:12px 0 0}
.intro-note strong{color:#d9cbd4}
@media(max-width:600px){.intro-manifesto{padding:22px 19px}.intro-title{font-size:clamp(46px,14vw,66px)}.intro-thesis{font-size:20px}.intro-copy{font-size:16px}}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.18em;color:var(--pink);text-transform:uppercase;margin:0 0 16px}h1{font-size:clamp(52px,10vw,86px);line-height:.9;letter-spacing:-.07em;margin:0 0 26px;font-weight:950}h2{font-size:clamp(35px,7vw,55px);line-height:1.02;letter-spacing:-.055em;margin:0 0 18px}h3{font-size:23px;line-height:1.1;margin:0 0 10px;letter-spacing:-.025em}p{color:var(--muted);margin:0 0 22px}.lead{font-size:19px}.choices{display:grid;gap:10px;margin:27px 0}.choice{display:block;width:100%;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--ink);text-align:left;padding:17px 19px;font-weight:750;min-height:59px}.choice:hover,.choice:focus-visible,.choice.selected{border-color:var(--pink);outline:none;background:#2c1424}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.actions{display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:12px;padding:15px 22px;min-height:54px;font-weight:900}.primary{background:var(--pink);color:#160510}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.subtle{background:none;border:0;color:var(--muted);text-decoration:underline;padding:12px 0}.input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:13px;padding:16px 18px;font-size:21px;margin:10px 0 4px}.input:focus{outline:2px solid var(--pink)}.hint,.fine{font-size:13px;color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(140deg,#21131e,#110e12);padding:24px;margin:15px 0}.card p:last-child{margin-bottom:0}.number{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.15em}.tag{display:inline-block;border:1px solid var(--pink);border-radius:50px;color:var(--pink);font-size:12px;font-weight:900;letter-spacing:.1em;padding:7px 12px;margin-bottom:18px}.error{color:#ff9abb;min-height:20px}.split{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.mini{color:var(--muted);font-size:14px}.price{font-size:48px;font-weight:950;letter-spacing:-.05em;color:var(--ink);margin:8px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:99px;font-size:12px;font-weight:900;color:var(--muted);margin:3px}.locked{opacity:.72}@media(max-width:600px){.grid2{grid-template-columns:1fr}}footer{max-width:600px;margin:65px auto 0;color:#958391;font-size:12px}@media(max-width:600px){main{padding:20px 18px 45px}.progress{margin-bottom:45px}.actions>*{flex:1}.actions .subtle{flex-basis:100%}}
@media print{body{background:white;color:black}main{max-width:none}.progress,.actions,.subtle,footer,.top small,.checkline{display:none!important}.card{background:white;color:black;border:1px solid #888;break-inside:avoid}p,.fine{color:#333}.eyebrow,.number,.tag{color:#111}h2{font-size:32px}}
</style></head><body><main><header class="top"><div class="logo">BOOKED <b>AF</b></div><small>Money. Career. Body. Life.</small></header><div class="progress" aria-hidden="true"><span id="bar"></span></div><div id="app" class="screen" aria-live="polite"></div><footer>BOOKED AF • Love your career. Keep your life.</footer></main>
<script src="app.js?v=20260923-cta2" defer></script></body></html>
