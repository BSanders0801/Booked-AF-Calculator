name: Deploy BOOKED AF test worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-test-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STRIPE_TEST_SECRET_KEY STRIPE_TEST_WEBHOOK_SECRET RESEND_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Deploy isolated test Worker
        run: npx --yes wrangler@4 deploy --config wrangler.test.jsonc

      - name: Set Stripe test secret
        shell: bash
        run: printf '%s' "$VALUE" | npx --yes wrangler@4 secret put STRIPE_SECRET_KEY --config wrangler.test.jsonc
        env:
          VALUE: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

      - name: Set Stripe test webhook secret
        shell: bash
        run: printf '%s' "$VALUE" | npx --yes wrangler@4 secret put STRIPE_WEBHOOK_SECRET --config wrangler.test.jsonc
        env:
          VALUE: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}

      - name: Set Resend key
        shell: bash
        run: printf '%s' "$VALUE" | npx --yes wrangler@4 secret put RESEND_API_KEY --config wrangler.test.jsonc
        env:
          VALUE: ${{ secrets.RESEND_API_KEY }}

      - name: Set optional report secret
        if: ${{ secrets.REPORT_SECRET != '' }}
        shell: bash
        run: printf '%s' "$VALUE" | npx --yes wrangler@4 secret put REPORT_SECRET --config wrangler.test.jsonc
        env:
          VALUE: ${{ secrets.REPORT_SECRET }}

      - name: Deployment reminder
        run: |
          echo "Test Worker deployed as booked-af-email-test."
          echo "Next: point the Stripe test webhook to /stripe-webhook and run the full-price + BETA100 end-to-end checks."
