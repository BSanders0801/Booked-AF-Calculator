name: Deploy BOOKED AF test worker

on:
  push:
    branches: [build/next30-shell-p04]
    paths:
      - '.github/workflows/deploy-booked-af-test-worker.yml'
      - 'wrangler.test.jsonc'
      - 'test-worker.mjs'
      - 'paid-content.mjs'
      - 'paid-loader.js'
      - 'fulfillment-store.mjs'
      - 'scripts/build-secure-site.mjs'
      - 'scripts/build-test-worker.mjs'
      - 'scripts/deploy-test-worker.mjs'
      - 'scripts/test-cloudflare-account.mjs'
      - 'tests/test-cloudflare-account.mjs'
      - 'tests/test-isolation.mjs'
      - 'review/TEST_DEPLOY_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booked-af-isolated-test
  cancel-in-progress: false

jobs:
  deploy-test-worker:
    if: github.ref == 'refs/heads/build/next30-shell-p04'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFARE_ACCOUNT_ID }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      RESEND_TEST_API_KEY: ${{ secrets.RESEND_TEST_API_KEY }}
      TEST_RECIPIENT_EMAIL: ${{ secrets.TEST_RECIPIENT_EMAIL }}
      BOOKED_AF_TEST_DEPLOY_ENABLED: ${{ vars.BOOKED_AF_TEST_DEPLOY_ENABLED }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify isolated payment behavior
        run: node --test --test-concurrency=1 tests/secure-delivery.mjs tests/test-cloudflare-account.mjs tests/test-isolation.mjs tests/stripe-welcome.mjs tests/survey.mjs tests/service-readiness.mjs
      - name: Check credential presence without exposing values
        run: node scripts/deploy-test-worker.mjs --check
      - name: Deploy only the isolated test environment
        if: env.BOOKED_AF_TEST_DEPLOY_ENABLED == 'true'
        run: node scripts/deploy-test-worker.mjs
      - name: Smoke-test isolated Worker and reject invalid payment access
        if: env.BOOKED_AF_TEST_DEPLOY_ENABLED == 'true'
        run: |
          node --input-type=module <<'JS'
          const base='https://booked-af-email-test.wild-recipe-42df.workers.dev';
          const health=await fetch(base+'/health',{signal:AbortSignal.timeout(15000)});
          const data=await health.json();
          if(!health.ok||data.isolated!==true||data.ready!==true||data.checkout!==true||data.webhook!==true)
            throw Error('Isolated checkout Worker readiness failed');
          const invalid=await fetch(base+'/verify-checkout?session_id=cs_live_fake',{signal:AbortSignal.timeout(15000)});
          const denied=await invalid.json();
          if(invalid.status!==400||denied.paid!==false)
            throw Error('Invalid checkout session was not denied');
          console.log('Isolated Worker healthy; invalid checkout access denied.');
          JS
      - name: Report deployment gate
        if: env.BOOKED_AF_TEST_DEPLOY_ENABLED != 'true'
        run: echo 'Checks completed. No deployment requested. Enable BOOKED_AF_TEST_DEPLOY_ENABLED only after the test credentials and recipient are approved.'
