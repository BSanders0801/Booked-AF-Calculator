name: Build social preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_social_card.py"
      - ".github/workflows/social-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build mobile-safe social card
        run: python scripts/generate_social_card.py
      - name: Commit generated image
        run: |
          if git diff --quiet -- assets/booked-af-social.png; then
            echo "Social preview already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/booked-af-social.png
          git commit -m "Add mobile-safe social preview image"
          git push
