name: BOOKED AF public launch smoke check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-launch-smoke.yml'
      - 'app.js'
      - 'breakdown-core.js'
      - 'personalization.js'
      - 'site-content.js'
      - 'site-ui.js'
      - 'index.html'
      - 'site.css'
      - 'lifecycle-ui.js'
      - 'paid-loader.js'
      - 'tests/**'
      - 'scripts/check-public-release.py'
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test visitor flow without sending email
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node tests/visitor-flow.cjs
          node tests/result-paths.cjs
          node tests/personalization.cjs
          npx --prefix tests playwright install --with-deps chromium webkit
          node tests/browser-journeys.cjs
          BROWSER_ENGINE=webkit node tests/browser-journeys.cjs
      - name: Validate free result paths
        run: node tests/check-free-breakdown.mjs
      - name: Verify the exact deployed website and email engine
        run: python3 scripts/check-public-release.py
