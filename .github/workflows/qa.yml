name: BOOKED AF QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm --prefix tests install --no-audit --no-fund

      - name: Run BOOKED AF test suite
        run: npm --prefix tests test
