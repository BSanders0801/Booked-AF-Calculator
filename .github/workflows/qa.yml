name: BOOKED AF QA

on:
  push:
    branches: [main, build/next30-shell-p04]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm --prefix tests install --no-audit --no-fund

      - name: Run BOOKED AF test suite
        run: npm --prefix tests test && npm --prefix tests run test:security && node scripts/prepare-release.mjs

      - name: Install browser for responsive review
        run: cd tests && npx playwright install --with-deps chromium webkit

      - name: Check phone and desktop layouts
        run: node tests/browser-layout.cjs && node tests/secure-browser.cjs && BROWSER_ENGINE=webkit node tests/secure-browser.cjs

      - name: Save responsive review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booked-af-responsive-review
          # Public repositories must not publish screenshots of paid lessons or worksheets.
          path: |
            .browser-review/*-intro.png
            .browser-review/*-paid.png
            .browser-review/secure/*-free.png
            .browser-review/secure/results.json
            .browser-review/secure-webkit/*-free.png
            .browser-review/secure-webkit/results.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
