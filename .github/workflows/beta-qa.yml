name: BOOKED AF beta verification
on:
  push:
    branches: [fix/beta-launch-20261025, fix/reconcile-beta-20261026, build/next30-shell-p04]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm --prefix tests ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix tests audit --audit-level=high
      - run: npm --prefix tests test && npm --prefix tests run test:security
      - name: Verify public answers and browser journeys
        run: |
          mkdir -p public/tests
          cp tests/public/* public/tests/
          ln -s ../../tests/node_modules public/tests/node_modules
          cd public
          node tests/personalization.cjs
          node tests/result-paths.cjs
          node tests/visitor-flow.cjs
          ../tests/node_modules/.bin/playwright install --with-deps chromium webkit
          node tests/browser-journeys.cjs
          BROWSER_ENGINE=webkit node tests/browser-journeys.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-public-browser-review
          path: /tmp/booked-result-*.png
          if-no-files-found: warn

  deploy-api:
    if: github.ref == 'refs/heads/fix/reconcile-beta-20261026'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: booked-af-production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build API with existing paid access preserved
        run: node scripts/prepare-release.mjs && node scripts/sync-free-engine.mjs --check && node scripts/build-public-launch.mjs
      - name: Deploy and verify production API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          EXPECTED_PRODUCTION_VERSION: 4cd70b6e-d9fa-45a9-ad58-e6cb99d96d7c
        run: node scripts/deploy-free-launch.mjs
